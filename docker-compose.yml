services:
  web:
    build: .
    depends_on:
      - flaresolverr
    ports:
      - "8001:8000"
    env_file:
      - .env
    environment:
      FLARESOLVERR_URL: http://flaresolverr:8191/v1
    volumes:
      - .:/app
      - ./franklin_flyers.db:/app/franklin_flyers.db
    restart: always

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    environment:
      LOG_LEVEL: info
      TZ: America/New_York
    restart: unless-stopped

volumes:
  db_data:
